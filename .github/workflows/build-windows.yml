name: Build Windows EXE

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Reconstruct and apply Tree-Grid WIP patch
        shell: pwsh
        run: |
          $parts = @(
            ".ci-wip/patch.b64.00",
            ".ci-wip/patch.b64.01",
            ".ci-wip/patch.b64.02"
          )
          $b64 = ""
          foreach ($part in $parts) {
            $b64 += (Get-Content $part -Raw).Trim()
          }

          $gzipPath = Join-Path $PWD "treegrid-wip.patch.gz"
          $patchPath = Join-Path $PWD "treegrid-wip.patch"
          [System.IO.File]::WriteAllBytes(
            $gzipPath,
            [System.Convert]::FromBase64String($b64)
          )

          $input = [System.IO.File]::OpenRead($gzipPath)
          try {
            $output = [System.IO.File]::Create($patchPath)
            try {
              $gzip = [System.IO.Compression.GZipStream]::new(
                $input,
                [System.IO.Compression.CompressionMode]::Decompress
              )
              try {
                $gzip.CopyTo($output)
              }
              finally {
                $gzip.Dispose()
              }
            }
            finally {
              $output.Dispose()
            }
          }
          finally {
            $input.Dispose()
          }

          git apply --check $patchPath
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git apply $patchPath
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Configure x64 Release
        run: cmake -S . -B build -A x64

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel 2>&1 | Tee-Object -FilePath build-output.txt
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $errors = Get-Content build-output.txt | Where-Object {
              $_ -match '(?i)(error\s+C\d+|fatal error|LNK\d+|error\s+MSB\d+|:\s*error\s+)'
            }
            if (-not $errors) {
              $errors = Get-Content build-output.txt | Select-Object -Last 20
            }
            $errors | Select-Object -First 20 | ForEach-Object {
              Write-Output ("::error::" + $_)
            }
            exit $code
          }

      - name: Run integration tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Upload standalone EXE
        uses: actions/upload-artifact@v7
        with:
          name: FolderMTimeFix-windows-x64
          path: build/Release/FolderMTimeFix.exe
          if-no-files-found: error
